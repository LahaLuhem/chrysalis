name: Build Android + Flutter Images

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Publish only on master pushes or a manual run; pull requests build-validate
# (both arches) without pushing. Each image is further gated on its own paths
# (see the gate step in prepare), so a change to one doesn't republish the other.
# Verify a feature branch with:
#   gh workflow run build_and_push.yml --ref <branch>

# Serialize publishes per ref so concurrent runs don't race on the shared
# tags (android-sdk:latest, flutter:stable). Don't cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter_version: ${{ steps.vars.outputs.flutter_version }}
      flutter_minor: ${{ steps.vars.outputs.flutter_minor }}
      docker_tag: ${{ steps.vars.outputs.docker_tag }}
      push: ${{ steps.vars.outputs.push }}
      build_android_sdk: ${{ steps.gate.outputs.build_android_sdk }}
      build_flutter: ${{ steps.gate.outputs.build_flutter }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load version variables
        id: vars
        run: |
          source versions.env
          {
            echo "flutter_version=$FLUTTER_VERSION"
            # 3.47.1 -> 3.47, so people can pin a minor line and still get its patches.
            echo "flutter_minor=${FLUTTER_VERSION%.*}"
            echo "docker_tag=$DOCKER_TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Which images can this change actually reach? android-sdk: its own dir, the assert
      # scripts (they run inside the publish job), and the two build workflows. flutter: all
      # of those, since it builds FROM that base, plus its own dir and versions.env. test.sh
      # and check-android-sdk.sh are out on purpose, neither is baked and neither runs in a
      # publish. Dispatch builds both, and if the changed files can't be listed we build both,
      # so this only ever skips work.
      - name: Gate each image on its own paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          emit() {
            {
              echo "build_android_sdk=$1"
              echo "build_flutter=$2"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "manual dispatch; building both."
            emit true true
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" || files=''
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
            # The compare API lists at most 300 files; a push that big is image-affecting in
            # practice, and the empty-list fallback below builds anyway.
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" || files=''
          else
            files=''  # new/forced ref: no usable diff base
          fi

          if [ -z "$files" ]; then
            echo "could not determine changed files; failing open (building both)."
            emit true true
            exit 0
          fi

          sdk=false
          flutter=false
          while IFS= read -r f; do
            case "$f" in
              images/android-sdk/*|scripts/assert_*.sh|.github/workflows/build-image.yml|.github/workflows/build_and_push.yml)
                echo "affects android-sdk, and so flutter: $f"
                sdk=true
                flutter=true
                ;;
              images/flutter/*|versions.env)
                echo "affects flutter: $f"
                flutter=true
                ;;
            esac
          done <<< "$files"
          [ "$flutter" = 'true' ] || echo "nothing image-affecting; skipping both."
          emit "$sdk" "$flutter"

  # The base image. When both build, this one publishes first, because flutter FROMs
  # android-sdk:latest. Built on every gated-in run, pushed only on publish runs.
  android-sdk:
    needs: prepare
    if: needs.prepare.outputs.build_android_sdk == 'true'
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-image.yml
    with:
      name: android-sdk
      context: images/android-sdk
      tags: latest
      title: Android SDK
      description: Android SDK (cmdline-tools, platform-tools, build-tools, a platform) on Ubuntu
      push: ${{ needs.prepare.outputs.push == 'true' }}

  # Built FROM the android-sdk manifest list, so publish runs only (it needs a pushed base).
  # Runs when android-sdk is skipped too, the base is already up there. !cancelled() is what
  # stops a skipped need from skipping this job with it. A failed one still does.
  flutter:
    needs: [prepare, android-sdk]
    if: >-
      !cancelled()
      && needs.prepare.outputs.push == 'true'
      && needs.prepare.outputs.build_flutter == 'true'
      && needs.android-sdk.result != 'failure'
      && needs.android-sdk.result != 'cancelled'
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-image.yml
    with:
      name: flutter
      context: images/flutter
      # Exact version first: it's what lands in the image's version label, and the merge job only
      # checks the first tag. APPENDIX.md#floating-minor-tag
      tags: |
        ${{ needs.prepare.outputs.flutter_version }}
        ${{ needs.prepare.outputs.flutter_minor }}
        ${{ needs.prepare.outputs.docker_tag }}
      title: Flutter
      description: Flutter on the chrysalis android-sdk base image
      build-args: |
        flutter_version=${{ needs.prepare.outputs.flutter_version }}
      push: ${{ needs.prepare.outputs.push == 'true' }}

  # The only requirable check here: the android-sdk and flutter calls change check name depending on
  # whether the gate skipped them, so a ruleset can't name either. This one is stable.
  images-ok:
    needs: [prepare, android-sdk, flutter]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: prepare=${{ needs.prepare.result }} android-sdk=${{ needs.android-sdk.result }} flutter=${{ needs.flutter.result }}
        run: |
          echo "$RESULTS"
          exit 1
