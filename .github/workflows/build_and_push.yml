name: Build Android + Flutter Images

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Publish only on master pushes or a manual run; pull requests build-validate
# (both arches) without pushing. Both are further gated on the change actually
# being able to affect the images (see the gate step in prepare); docs-, lint-,
# and config-only changes skip the build jobs entirely. Verify a feature branch
# with:
#   gh workflow run build_and_push.yml --ref <branch>

# Serialize publishes per ref so concurrent runs don't race on the shared
# tags (android-sdk:latest, flutter:stable). Don't cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter_version: ${{ steps.vars.outputs.flutter_version }}
      flutter_minor: ${{ steps.vars.outputs.flutter_minor }}
      docker_tag: ${{ steps.vars.outputs.docker_tag }}
      push: ${{ steps.vars.outputs.push }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load version variables
        id: vars
        run: |
          source versions.env
          {
            echo "flutter_version=$FLUTTER_VERSION"
            # 3.47.1 -> 3.47, so people can pin a minor line and still get its patches.
            echo "flutter_minor=${FLUTTER_VERSION%.*}"
            echo "docker_tag=$DOCKER_TAG"
          } >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Build (and so publish) only when the change can affect the published images or the
      # pipeline that assembles them: the Dockerfiles and their baked scripts (images/),
      # versions.env, the assert/verify scripts (scripts/), and the two build workflows.
      # Everything else (docs, test.yml, lint-tools.env, renovate.jsonc, ...) can't change
      # image bytes, so building would only republish identical layers under new digests.
      # Manual dispatch always builds (it's the deliberate publish path), and any failure to
      # list the changed files fails open to building: skipping is only ever an optimization.
      - name: Gate on image-affecting changes
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "manual dispatch; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" || files=''
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
            # The compare API lists at most 300 files; a push that big is image-affecting in
            # practice, and the empty-list fallback below builds anyway.
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" || files=''
          else
            files=''  # new/forced ref: no usable diff base
          fi

          if [ -z "$files" ]; then
            echo "could not determine changed files; failing open (building)."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build=false
          while IFS= read -r f; do
            case "$f" in
              images/*|versions.env|scripts/*|.github/workflows/build-image.yml|.github/workflows/build_and_push.yml)
                echo "image-affecting: $f"
                build=true
                ;;
            esac
          done <<< "$files"
          [ "$build" = 'true' ] || echo "no image-affecting changes; skipping build/publish."
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # android-sdk is the base image; it must publish before flutter builds (flutter
  # FROMs android-sdk:latest). Built on every gated-in run, pushed only on publish
  # runs. When the gate skips it, flutter is skipped too (a skipped need skips
  # dependents), so a gated-out run is prepare-only.
  android-sdk:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-image.yml
    with:
      name: android-sdk
      context: images/android-sdk
      tags: latest
      title: Android SDK
      description: Android SDK (cmdline-tools, platform-tools, build-tools, a platform) on Ubuntu
      push: ${{ needs.prepare.outputs.push == 'true' }}

  # flutter is built FROM the android-sdk manifest list, so it only runs on
  # publish runs (it needs the pushed base).
  flutter:
    needs: [prepare, android-sdk]
    if: needs.prepare.outputs.push == 'true'
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/build-image.yml
    with:
      name: flutter
      context: images/flutter
      # Exact version first: it's what lands in the image's version label, and the merge job only
      # checks the first tag. APPENDIX.md#floating-minor-tag
      tags: |
        ${{ needs.prepare.outputs.flutter_version }}
        ${{ needs.prepare.outputs.flutter_minor }}
        ${{ needs.prepare.outputs.docker_tag }}
      title: Flutter
      description: Flutter on the chrysalis android-sdk base image
      build-args: |
        flutter_version=${{ needs.prepare.outputs.flutter_version }}
      push: ${{ needs.prepare.outputs.push == 'true' }}

  # The only requirable check here: the android-sdk and flutter calls change check name depending on
  # whether the gate skipped them, so a ruleset can't name either. This one is stable.
  images-ok:
    needs: [prepare, android-sdk, flutter]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: prepare=${{ needs.prepare.result }} android-sdk=${{ needs.android-sdk.result }} flutter=${{ needs.flutter.result }}
        run: |
          echo "$RESULTS"
          exit 1
