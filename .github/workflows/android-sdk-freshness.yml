name: Android SDK freshness

# Weekly: opens one tracking issue when Google's manifest moves ahead of the Android SDK pins in
# images/android-sdk/Dockerfile, updates it as they move, and closes it once they catch up.
# Bumps stay manual. Which pins, and why Renovate can't track them: scripts/check-android-sdk.sh.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC, matching Renovate's weekly cadence
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Android SDK pins against Google's manifest
        id: check
        run: bash scripts/check-android-sdk.sh

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.check.outputs.behind }}
          DETAILS: ${{ steps.check.outputs.details }}
        shell: bash
        run: |
          label='android-sdk-update'
          title='Android SDK pins are behind upstream'

          # The label has to exist before we can list or create against it, and --force means
          # re-running this is fine.
          gh label create "$label" --force \
            --color FBCA04 \
            --description "An Android SDK pin is behind Google's manifest"

          existing="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"

          if [ "$BEHIND" = "true" ]; then
            intro="Android SDK pins behind Google's manifest:"
            footer="Bump them in \`images/android-sdk/Dockerfile\`. Leave \`ANDROID_BUILD_TOOLS_VERSION\` alone, it follows what AGP asks for rather than the manifest (AGENTS.md rule 11). Filed and kept current by the weekly \`android-sdk-freshness\` workflow, which closes it once the pins catch up."
            body="$(printf '%s\n\n%s\n\n%s\n' "$intro" "$DETAILS" "$footer")"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body"
              echo "updated issue #$existing"
            else
              gh issue create --label "$label" --title "$title" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment 'Nothing left to act on here. Closing automatically.'
            echo "closed issue #$existing"
          else
            echo 'Android SDK pins are current, nothing to do.'
          fi
