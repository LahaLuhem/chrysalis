name: Android SDK freshness

# Weekly check that the Android SDK platform pin in images/android-sdk/Dockerfile is still the
# latest stable platform in Google's manifest. Renovate can't track it: its customDatasource
# can't parse the manifest XML, and the scrapeable HTML pages lag or pre-announce packages that
# aren't installable yet. So this stands in for a Renovate "update available" PR: on drift it
# opens (or updates) one tracking issue, and closes it once the pin catches up. The bump itself
# stays manual (verify-before-pin). build-tools is deliberately out of scope here, since it
# follows AGP's request rather than the manifest (AGENTS.md rule 11).
# scripts/check-android-sdk.sh holds the logic and runs locally too.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC, matching Renovate's weekly cadence
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Android SDK pins against Google's manifest
        id: check
        run: bash scripts/check-android-sdk.sh

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.check.outputs.behind }}
          DETAILS: ${{ steps.check.outputs.details }}
        shell: bash
        run: |
          label='android-sdk-update'
          title='Android SDK pins are behind upstream'

          # Idempotent: ensure the tracking label exists before we list/create against it.
          gh label create "$label" --force \
            --color FBCA04 \
            --description "Android SDK platform pin is behind Google's manifest"

          existing="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"

          if [ "$BEHIND" = "true" ]; then
            intro='The Android SDK platform pin is behind the latest stable platform in the upstream manifest:'
            footer="Bump \`ANDROID_PLATFORM_VERSION\` in \`images/android-sdk/Dockerfile\`, verifying against the manifest first. Do NOT touch \`ANDROID_BUILD_TOOLS_VERSION\`: it follows AGP's request, not the manifest (AGENTS.md rule 11). Filed and maintained by the weekly \`android-sdk-freshness\` workflow, which updates this issue as the platform moves and closes it once the pin is current."
            body="$(printf '%s\n\n%s\n%s\n' "$intro" "$DETAILS" "$footer")"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body"
              echo "updated issue #$existing"
            else
              gh issue create --label "$label" --title "$title" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment 'The Android SDK platform pin is current. Closing automatically.'
            echo "closed issue #$existing"
          else
            echo 'Android SDK platform pin is current; nothing to do.'
          fi
