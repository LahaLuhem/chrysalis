name: Cleanup old package versions

# Two weekly prunes across the flutter and android-sdk packages.
#
# Untagged: publishes used to orphan the index their moving tag left behind. Every publish now also
# carries a sha-<commit> tag (APPENDIX.md#sha-tags), so that mostly stopped and this is down to
# catching half-finished pushes.
#
# sha tags: nothing else would ever clear them. Safe next to the version tags, because the action
# unlinks a tag whose image carries others and drops the image only once its last tag goes. So
# pruning sha-x off an index still tagged 3.47.1 loses just the one tag.

on:
  schedule:
    - cron: "30 4 * * 1"   # Mondays 04:30 UTC, matching Renovate's weekly cadence
  workflow_dispatch:

# One cleanup at a time; don't cancel an in-flight run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune untagged generations (keep newest 10, nothing younger than 30 days)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: flutter,android-sdk
          keep-n-untagged: 10
          older-than: "30 days"
          dry-run: false

      - name: Prune sha tags (keep newest 20, nothing younger than 6 months)
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          packages: flutter,android-sdk
          delete-tags: "sha-*"
          exclude-tags: latest,stable
          keep-n-tagged: 20
          older-than: "6 months"
          dry-run: false
