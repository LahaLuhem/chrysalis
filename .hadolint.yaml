# hadolint config for the chrysalis images.
#
# Every entry below is a deliberate choice, not a blanket mute. Anything not
# listed here stays enforced. If you add a rule, say why in a comment.
ignored:
  - DL3008  # we want the latest apt packages, and pins would freeze them
  - DL3003  # `cd /opt` lasts only for its RUN, while a WORKDIR would stick for the rest of the image
  - DL4006  # `set -o pipefail` would break the `yes | sdkmanager` idiom
